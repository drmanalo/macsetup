---
- name: Ensure Portainer data volume exists
  community.docker.docker_volume:
    name: "{{ portainer_volume_name | default('portainer_data') }}"
    state: present

- name: Install Portainer CE
  community.docker.docker_container:
    name: portainer
    image: "{{ portainer_image | default('portainer/portainer-ce:latest') }}"
    state: started
    restart_policy: always
    ports:
      - "{{ portainer_https_port | default('9443') }}:9443"
      - "{{ portainer_tunnel_port | default('3000') }}:3000"
    volumes:
      - "{{ portainer_docker_socket | default('/var/run/docker.sock') }}:/var/run/docker.sock"
      - "{{ portainer_volume_name | default('portainer_data') }}:/data"
