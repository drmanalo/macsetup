---
- name: Check if ollama exists
  stat:
    path: /usr/local/bin/ollama
  register: ollama_check

- name: Download ollama install script
  get_url:
    url: https://ollama.com/install.sh
    dest: /tmp/ollama_install.sh
    mode: '0755'
  when: not ollama_check.stat.exists

- name: Run ollama install script
  shell: /tmp/ollama_install.sh
  args:
    executable: /bin/bash
  when: not ollama_check.stat.exists

- name: Ensure ollama is executable
  file:
    path: /usr/local/bin/ollama
    mode: '0755'

- name: Verify ollama installation
  command: ollama --version
  register: ollama_version

- debug:
    var: ollama_version.stdout
